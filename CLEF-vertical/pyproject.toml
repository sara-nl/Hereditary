[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clef-vertical"
version = "1.0.0"
description = ""
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.18.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "scikit-learn",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "Douwe"

[tool.flwr.app.components]
serverapp = "clef_vertical.server_app:app"
clientapp = "clef_vertical.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 200
fraction-fit = 0.5
local-epochs = 1
learning-rate = 0.001
batch-size = 128
embedding-size = 16
dropout-rate = 0.2
personal-hidden-sizes = "32"
clinical-hidden-sizes = "32"
combined-hidden-sizes = "16,8"

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 2

[tool.flwr.federations.local-superlink]
options.num-supernodes = 2
address="127.0.0.1:9093"
insecure=true

