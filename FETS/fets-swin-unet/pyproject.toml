[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fets-swin-unet"
version = "1.0.0"
description = ""
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.14.0",
    "flwr-datasets[vision]>=0.3.0",
    "torch==2.2.1",
    "torchvision==0.17.1",
    "monai==1.4.0",
    "numpy",
    "pandas",
    "einops",
    "nibabel==5.3.2",
    "matplotlib==3.10.0"
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "douwe"

[tool.flwr.app.components]
serverapp = "fets_swin_unet.server_app:app"
clientapp = "fets_swin_unet.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
fraction-fit = 0.5
local-epochs = 1
roi = "128,128,128"
infer-overlap = 0.5
batch-size = 1
sw-batch-size = 4

[tool.flwr.federations]
default = "surfsuperlink"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 2

[tool.flwr.federations.local-superlink]
options.num-supernodes = 2
address="127.0.0.1:9093"
insecure=true

[tool.flwr.federations.surfsuperlink]
options.num-supernodes = 2
address="IP_HERE:9093"
root-certificates = "PATH_TO/certificates/ca.crt"

