[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secaggexample"
version = "1.0.0"
description = "Secure Aggregation in Flower"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.19.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "tensorboard>=2.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "secaggexample.server_app:app"
clientapp = "secaggexample.client_app:app"


[tool.flwr.app.config]
num-server-rounds = 50
fraction-evaluate = 0
local-epochs = 1
learning-rate = 0.05
batch-size = 128
# Parameters for the SecAgg+ protocol
num-shares = 5
reconstruction-threshold = 3
max-weight = 10000
timeout = 15.0


# TensorBoard configuration
tensorboard-run-name = "no-sec-agg-local-sim-10-clients"

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-superlink]
options.num-supernodes = 10
address="127.0.0.1:9093"
insecure=true

[tool.flwr.federations.local-simulation]
options.num-supernodes = 5
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.1
