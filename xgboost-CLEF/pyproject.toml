[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xgboost_comprehensive"
version = "1.0.0"
description = "Federated Learning with XGBoost and Flower applied to CLEF dataset"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.13.1",
    "flwr-datasets>=0.3.0",
    "xgboost>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "xgboost_comprehensive.server_app:app"
clientapp = "xgboost_comprehensive.client_app:app"

[tool.flwr.app.config]
# ServerApp
train-method = "bagging" # Choose from [bagging, cyclic]
num-server-rounds = 5
fraction-fit = 1.0
fraction-evaluate = 1.0
centralised-eval = false

# ClientApp
local-epochs = 1
scaled-lr = false
params.objective = "reg:squarederror" # "binary:logistic"
params.eta = 0.1 # Learning rate
params.max-depth = 15
params.eval-metric = "rmse" # "auc"
params.nthread = 16
params.num-parallel-tree = 12
params.subsample = 1
params.tree-method = "hist"

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 2
options.backend.client-resources.num-cpus = 2
