[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "messaging-api-example"
version = "1.0.0"
description = "Basic example of using the messaging api"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "d0uwe"

[tool.flwr.app.components]
serverapp = "messaginapiexample.server_app:app"
clientapp = "messaginapiexample.client_app:app"

[tool.flwr.app.config]
test_param = 3

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 2

